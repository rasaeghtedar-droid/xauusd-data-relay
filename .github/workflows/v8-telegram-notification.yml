name: V8 Telegram Notification

on:
  workflow_run:
    workflows: ["V8 Cap4 Dashboard"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: "v8-telegram-notification"
  cancel-in-progress: false

jobs:
  notify:
    if: \${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8 experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups

      - name: Download V8 payload from triggering run
        if: \${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: v8-telegram-payload
          path: data
          run-id: \${{ github.event.workflow_run.id }}
          github-token: \${{ secrets.GITHUB_TOKEN }}

      - name: Download latest successful V8 payload (5-minute fallback)
        if: \${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data

          RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "V8 Cap4 Dashboard" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          test -n "$RUN_ID"
          echo "Latest successful V8 run: $RUN_ID"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name v8-telegram-payload \
            --dir data

          test -f data/xauusd_v8_live.json

      - name: Send Telegram test message
        if: \${{ github.event_name == 'workflow_dispatch' }}
        env:
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: \${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          message = """🧪 XAUUSD V8 Cap4 — TELEGRAM TEST

این پیام فقط برای تست Notification Bot است.
موتور V8 در این تست اجرا نشده است.
Auto Trade DISABLED"""

          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          body = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
          }).encode()

          req = urllib.request.Request(url, data=body, method="POST")
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)

          if not result.get("ok"):
              raise RuntimeError(result)

          print("Telegram test message sent successfully.")
          PY

      - name: Send new V8 signal to Telegram
        if: \${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' }}
        env:
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: \${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -f data/xauusd_v8_live.json
          python scripts/v8_telegram_notify.py

      - name: Persist Telegram notification state
        if: \${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/xauusd_v8_telegram_state.json ]; then
            git add data/xauusd_v8_telegram_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Persist V8 Telegram notification state"
              git push origin HEAD:experiment-fvg-setups
            fi
          fi
