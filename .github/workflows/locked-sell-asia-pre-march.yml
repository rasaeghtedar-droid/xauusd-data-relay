name: XAUUSD Locked SELL Asia Pre-March

on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/locked_sell_asia_pre_march.py
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd-locked-sell-asia-pre-march
          path: backtest/locked_sell_asia_pre_march.json
      - run: |
          git config user.name "xauusd-data-relay"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/locked_sell_asia_pre_march.json
          git diff --cached --quiet || git commit -m "Add locked SELL Asia pre-March validation"
          git pull --rebase origin main
          git push
