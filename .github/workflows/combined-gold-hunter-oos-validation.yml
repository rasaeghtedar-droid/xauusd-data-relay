name: Combined Gold Hunter OOS Validation

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout combined experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run locked OOS validation
        env:
          COMBINED_START_UTC: "2026-08-01T00:00:00+00:00"
          COMBINED_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/combined_gold_hunter_backtest.py | tee /tmp/combined_oos_output.txt

      - name: Upload OOS result
        uses: actions/upload-artifact@v4
        with:
          name: combined-gold-hunter-oos-results
          path: backtest/combined_gold_hunter_results.json
