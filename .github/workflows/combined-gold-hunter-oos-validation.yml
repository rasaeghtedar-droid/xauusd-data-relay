name: Combined Gold Hunter OOS Validation

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout combined experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run locked OOS validation
        run: |
          python scripts/combined_gold_hunter_oos_validation.py | tee /tmp/combined_oos_output.txt

      - name: Upload OOS result
        uses: actions/upload-artifact@v4
        with:
          name: combined-gold-hunter-oos-results
          path: backtest/combined_gold_hunter_results.json
