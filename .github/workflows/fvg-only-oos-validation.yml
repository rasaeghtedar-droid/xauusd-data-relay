name: FVG Only OOS Validation
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FVG-only experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run locked FVG-only OOS validation
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_only_gold_hunter_backtest.py | tee /tmp/fvg_only_oos_output.txt
      - name: Run FVG-only diagnostics
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_only_diagnostics.py
      - name: Run independent FVG lifecycle diagnostics
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_independent_lifecycle_diagnostics.py
      - name: Run confirmed FVG setup performance
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_confirmed_setups_performance.py
      - name: Run FVG target diagnostics
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_target_diagnostics.py
      - name: Run nearest structural target diagnostic
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_nearest_target_diagnostics.py
      - name: Run RR bucket diagnostics
        run: |
          python scripts/fvg_rr_bucket_diagnostics.py
      - name: Run FVG RR 2-plus diagnostic
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_rr2_plus_diagnostics.py
      - name: Print RR 2-plus diagnostic
        run: |
          echo "===== FVG RR 2-PLUS DIAGNOSTICS JSON ====="
          cat backtest/fvg_rr2_plus_diagnostics.json
          echo "===== END FVG RR 2-PLUS DIAGNOSTICS JSON ====="
      - name: Print RR bucket diagnostics
        run: |
          echo "===== FVG RR BUCKET DIAGNOSTICS JSON ====="
          cat backtest/fvg_rr_bucket_diagnostics.json
          echo "===== END FVG RR BUCKET DIAGNOSTICS JSON ====="
      - name: Print FVG-only diagnostics
        run: |
          echo "===== FVG-ONLY DIAGNOSTICS JSON ====="
          cat backtest/fvg_only_diagnostics.json
          echo "===== END FVG-ONLY DIAGNOSTICS JSON ====="
      - name: Print independent FVG lifecycle diagnostics
        run: |
          echo "===== INDEPENDENT FVG LIFECYCLE JSON ====="
          cat backtest/fvg_independent_lifecycle_diagnostics.json
          echo "===== END INDEPENDENT FVG LIFECYCLE JSON ====="
      - name: Print confirmed FVG setup performance
        run: |
          echo "===== CONFIRMED FVG SETUP PERFORMANCE JSON ====="
          cat backtest/fvg_confirmed_setups_performance.json
          echo "===== END CONFIRMED FVG SETUP PERFORMANCE JSON ====="
      - name: Print FVG target diagnostics
        run: |
          echo "===== FVG TARGET DIAGNOSTICS JSON ====="
          cat backtest/fvg_target_diagnostics.json
          echo "===== END FVG TARGET DIAGNOSTICS JSON ====="
      - name: Print nearest structural target diagnostic
        run: |
          echo "===== FVG NEAREST TARGET DIAGNOSTICS JSON ====="
          cat backtest/fvg_nearest_target_diagnostics.json
          echo "===== END FVG NEAREST TARGET DIAGNOSTICS JSON ====="
      - name: Run independent FVG RR2 research backtest
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_independent_rr2_backtest.py | tee /tmp/fvg_independent_rr2_output.txt
      - name: Print independent FVG RR2 result
        run: |
          echo "===== INDEPENDENT FVG RR2 RESULT JSON ====="
          cat backtest/fvg_independent_rr2_results.json
          echo "===== END INDEPENDENT FVG RR2 RESULT ====="
      - name: Print FVG-only result
        run: |
          echo "===== FVG-ONLY RESULT JSON ====="
          cat backtest/fvg_only_gold_hunter_results.json
          echo "===== END FVG-ONLY RESULT JSON ====="
      - name: Upload FVG-only result
        uses: actions/upload-artifact@v4
        with:
          name: fvg-only-oos-results
          path: |
            backtest/fvg_only_gold_hunter_results.json
            backtest/fvg_only_diagnostics.json
            backtest/fvg_independent_lifecycle_diagnostics.json
            backtest/fvg_confirmed_setups_performance.json
            backtest/fvg_target_diagnostics.json
            backtest/fvg_nearest_target_diagnostics.json
            backtest/fvg_rr_bucket_diagnostics.json
            backtest/fvg_rr2_plus_diagnostics.json
