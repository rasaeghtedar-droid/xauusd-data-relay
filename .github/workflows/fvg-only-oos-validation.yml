name: FVG Only OOS Validation
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FVG-only experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run locked FVG-only OOS validation
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_only_gold_hunter_backtest.py | tee /tmp/fvg_only_oos_output.txt
      - name: Run FVG-only diagnostics
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_only_diagnostics.py
      - name: Run independent FVG lifecycle diagnostics
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_independent_lifecycle_diagnostics.py
      - name: Run confirmed FVG setup performance
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_confirmed_setups_performance.py
      - name: Run FVG target diagnostics
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_target_diagnostics.py
      - name: Run nearest structural target diagnostic
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_nearest_target_diagnostics.py
      - name: Run RR bucket diagnostics
        run: |
          python scripts/fvg_rr_bucket_diagnostics.py
      - name: Run FVG RR 2-plus diagnostic
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          python scripts/fvg_rr2_plus_diagnostics.py
      - name: Print RR 2-plus diagnostic
        run: |
          echo "===== FVG RR 2-PLUS DIAGNOSTICS JSON ====="
          cat backtest/fvg_rr2_plus_diagnostics.json
          echo "===== END FVG RR 2-PLUS DIAGNOSTICS JSON ====="
      - name: Print RR bucket diagnostics
        run: |
          echo "===== FVG RR BUCKET DIAGNOSTICS JSON ====="
          cat backtest/fvg_rr_bucket_diagnostics.json
          echo "===== END FVG RR BUCKET DIAGNOSTICS JSON ====="
      - name: Print FVG-only diagnostics
        run: |
          echo "===== FVG-ONLY DIAGNOSTICS JSON ====="
          cat backtest/fvg_only_diagnostics.json
          echo "===== END FVG-ONLY DIAGNOSTICS JSON ====="
      - name: Print independent FVG lifecycle diagnostics
        run: |
          echo "===== INDEPENDENT FVG LIFECYCLE JSON ====="
          cat backtest/fvg_independent_lifecycle_diagnostics.json
          echo "===== END INDEPENDENT FVG LIFECYCLE JSON ====="
      - name: Print confirmed FVG setup performance
        run: |
          echo "===== CONFIRMED FVG SETUP PERFORMANCE JSON ====="
          cat backtest/fvg_confirmed_setups_performance.json
          echo "===== END CONFIRMED FVG SETUP PERFORMANCE JSON ====="
      - name: Print FVG target diagnostics
        run: |
          echo "===== FVG TARGET DIAGNOSTICS JSON ====="
          cat backtest/fvg_target_diagnostics.json
          echo "===== END FVG TARGET DIAGNOSTICS JSON ====="
      - name: Print nearest structural target diagnostic
        run: |
          echo "===== FVG NEAREST TARGET DIAGNOSTICS JSON ====="
          cat backtest/fvg_nearest_target_diagnostics.json
          echo "===== END FVG NEAREST TARGET DIAGNOSTICS JSON ====="
      - name: Run independent FVG RR2 research backtest
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_independent_rr2_backtest.py | tee /tmp/fvg_independent_rr2_output.txt
      - name: Print independent FVG RR2 result
        run: |
          echo "===== INDEPENDENT FVG RR2 RESULT JSON ====="
          cat backtest/fvg_independent_rr2_results.json
          echo "===== END INDEPENDENT FVG RR2 RESULT ====="
      - name: Run queued FVG RR2 one-trade research backtest
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_queued_rr2_backtest.py | tee /tmp/fvg_queued_rr2_output.txt
      - name: Print queued FVG RR2 result
        run: |
          echo "===== QUEUED FVG RR2 RESULT JSON ====="
          cat backtest/fvg_queued_rr2_results.json
          echo "===== END QUEUED FVG RR2 RESULT ====="
      - name: Run realistic FVG RR2 backtest
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_realistic_rr2_backtest.py | tee /tmp/fvg_realistic_rr2_output.txt
      - name: Run temporal FVG audit
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_temporal_audit_rr2.py | tee /tmp/fvg_temporal_audit_output.txt
      - name: Print temporal FVG audit result
        run: |
          echo "===== TEMPORAL FVG AUDIT RESULT JSON ====="
          cat backtest/fvg_temporal_audit_results.json
          echo "===== END TEMPORAL FVG AUDIT RESULT ====="
      - name: Run temporal FVG entry audit v2
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_temporal_audit_v2.py | tee /tmp/fvg_temporal_audit_v2_output.txt
      - name: Print temporal FVG entry audit v2 result
        run: |
          echo "===== TEMPORAL FVG ENTRY AUDIT V2 RESULT JSON ====="
          cat backtest/fvg_temporal_audit_v2_results.json
          echo "===== END TEMPORAL FVG ENTRY AUDIT V2 RESULT ====="
      - name: Run temporal FVG audit v3
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_temporal_audit_v3.py | tee /tmp/fvg_temporal_audit_v3_output.txt
      - name: Print temporal FVG audit v3 result
        run: |
          echo "===== TEMPORAL FVG AUDIT V3 RESULT JSON ====="
          cat backtest/fvg_temporal_audit_v3_results.json
          echo "===== END TEMPORAL FVG AUDIT V3 RESULT ====="
      - name: Run executable FVG audit v4
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_executable_audit_v4.py | tee /tmp/fvg_executable_audit_v4_output.txt
      - name: Print executable FVG audit v4 result
        run: |
          echo "===== EXECUTABLE FVG AUDIT V4 RESULT JSON ====="
          cat backtest/fvg_temporal_audit_v4_results.json
          echo "===== END EXECUTABLE FVG AUDIT V4 RESULT ====="
      - name: Run executable FVG audit v5
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_executable_audit_v5.py | tee /tmp/fvg_executable_audit_v5_output.txt
      - name: Print executable FVG audit v5 result
        run: |
          echo "===== EXECUTABLE FVG AUDIT V5 RESULT JSON ====="
          cat backtest/fvg_temporal_audit_v5_results.json
          echo "===== END EXECUTABLE FVG AUDIT V5 RESULT ====="
      - name: Run executable FVG audit v6
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_executable_audit_v6.py | tee /tmp/fvg_executable_audit_v6_output.txt
      - name: Print executable FVG audit v6 result
        run: |
          echo "===== EXECUTABLE FVG AUDIT V6 RESULT JSON ====="
          cat backtest/fvg_executable_audit_v6_results.json
          echo "===== END EXECUTABLE FVG AUDIT V6 RESULT ====="
      - name: Run executable FVG audit v8
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_executable_audit_v8.py | tee /tmp/fvg_executable_audit_v8_output.txt
      - name: Run V8 stability windows
        env:
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_v8_stability_windows.py | tee /tmp/fvg_v8_stability_windows_output.txt
      - name: Print V8 stability windows result
        run: |
          echo "===== FVG V8 STABILITY WINDOWS JSON ====="
          cat backtest/fvg_v8_stability_windows_results.json
          echo "===== END FVG V8 STABILITY WINDOWS ====="
      - name: Run V8 target sensitivity replay
        env:
          FVG_ONLY_START_UTC: "2026-08-01T00:00:00+00:00"
          FVG_ONLY_END_UTC: "2026-09-09T23:59:59+00:00"
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
        run: |
          set -o pipefail
          python scripts/fvg_v8_target_sensitivity.py | tee /tmp/fvg_v8_target_sensitivity_output.txt
      - name: Print V8 target sensitivity result
        run: |
          echo "===== FVG V8 TARGET SENSITIVITY JSON ====="
          cat backtest/fvg_v8_target_sensitivity_results.json
          echo "===== END FVG V8 TARGET SENSITIVITY ====="
      - name: Print executable FVG audit v8 result
        run: |
          echo "===== EXECUTABLE FVG AUDIT V8 RESULT JSON ====="
          cat backtest/fvg_executable_audit_v8_results.json
          echo "===== END V8 ====="
      - name: Reconcile realistic vs executable V8
        run: |
          python scripts/reconcile_realistic_vs_audit_v6.py
      - name: Print first V8 divergence
        run: |
          echo "===== REALISTIC VS AUDIT V8 RECONCILIATION ====="
          cat backtest/fvg_realistic_vs_audit_v8_reconciliation.json
          echo "===== END V8 RECONCILIATION ====="
      - name: Print realistic FVG RR2 result
        run: |
          echo "===== REALISTIC FVG RR2 RESULT JSON ====="
          cat backtest/fvg_realistic_rr2_results.json
          echo "===== END REALISTIC FVG RR2 RESULT ====="
      - name: Print FVG-only result
        run: |
          echo "===== FVG-ONLY RESULT JSON ====="
          cat backtest/fvg_only_gold_hunter_results.json
          echo "===== END FVG-ONLY RESULT JSON ====="
      - name: Upload FVG-only result
        uses: actions/upload-artifact@v4
        with:
          name: fvg-only-oos-results
          path: |
            backtest/fvg_only_gold_hunter_results.json
            backtest/fvg_only_diagnostics.json
            backtest/fvg_independent_lifecycle_diagnostics.json
            backtest/fvg_confirmed_setups_performance.json
            backtest/fvg_target_diagnostics.json
            backtest/fvg_nearest_target_diagnostics.json
            backtest/fvg_rr_bucket_diagnostics.json
            backtest/fvg_rr2_plus_diagnostics.json
            backtest/fvg_temporal_audit_v2_results.json
            backtest/fvg_temporal_audit_v3_results.json
            backtest/fvg_temporal_audit_v4_results.json
            backtest/fvg_executable_audit_v8_results.json
