name: V8 Cap4 Diagnostic Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8 audit code
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups

      - name: Fetch latest relay dataset
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/rasaeghtedar-droid/xauusd-data-relay/main/data/xauusd_analysis.json" \
            -o /tmp/xauusd_analysis.json

      - name: Run exact V8 Cap4 audit on last 50 M5 candles
        env:
          COMBINED_SOURCE_URL: "relay://main/data/xauusd_analysis.json"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path("/tmp/xauusd_analysis.json").read_text(encoding="utf-8"))
          bars = payload["intervals"]["5m"]["bars"]

          if len(bars) < 100:
              raise RuntimeError(f"Need at least 100 closed M5 bars for 50-bar evaluation; got {len(bars)}")

          # Keep 50 warm-up candles + the last 50 evaluation candles.
          test_bars = bars[-100:]

          import scripts.fvg_executable_audit_v8 as audit

          audit.load = lambda: test_bars
          audit.SOURCE = "Biquote relay: main/data/xauusd_analysis.json"
          audit.START = test_bars[0]["openTime"]
          audit.END = test_bars[-1]["openTime"]

          audit.main()
          PY

      - name: Print diagnostic result
        run: |
          set -euo pipefail
          cat backtest/fvg_executable_audit_v8_results.json
