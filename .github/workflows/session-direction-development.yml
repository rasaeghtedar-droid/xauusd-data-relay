name: XAUUSD Session Direction Development

on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/session_direction_development.py
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd-session-direction-development
          path: backtest/session_direction_development.json
      - run: |
          git config user.name "xauusd-data-relay"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/session_direction_development.json
          git diff --cached --quiet || git commit -m "Add session direction development analysis"
          git pull --rebase origin main
          git push
