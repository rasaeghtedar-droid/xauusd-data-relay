name: V8 Cap4 Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V8 experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups

      - name: Run V8 Cap4 live dry-run
        run: |
          set -euo pipefail
          python scripts/fvg_v8_live_dry_run.py

      - name: Persist V8 signal history
        run: |
          set -euo pipefail
          if [ -f data/xauusd_v8_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/xauusd_v8_history.json
            if ! git diff --cached --quiet; then
              git commit -m "Persist V8 signal history"
              git push origin HEAD:experiment-fvg-setups
            fi
          fi

      - name: Prepare dashboard site
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp dashboard/index.html _site/index.html
          if [ -f data/xauusd_analysis.json ]; then
            cp data/xauusd_analysis.json _site/data/xauusd_analysis.json
          else
            printf '{"status":"DATA_NOT_AVAILABLE"}' > _site/data/xauusd_analysis.json
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
