name: V8 Cap4 Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V8 experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups

      - name: Run V8 Cap4 live dry-run
        run: |
          set -euo pipefail
          python scripts/fvg_v8_live_dry_run.py
      - name: Prepare Telegram signal notification
        run: |
          set -euo pipefail

          python - <<'PY'
          import json

          path = "data/xauusd_v8_live.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          signal = data.get("signal")
          latest = data.get("latest_closed_m5")

          # فقط سیگنال جدید روی آخرین کندل بسته‌شده ارسال شود.
          # سیگنال فعال قبلی دوباره تلگرام نشود.
          if data.get("status") != "SIGNAL" or not signal:
              raise SystemExit(0)

          if signal.get("confirmation_time") != latest:
              raise SystemExit(0)

          direction = signal.get("direction", "?")
          entry = signal.get("entry", "?")
          sl = signal.get("sl", "?")
          tp = signal.get("tp", "?")
          rr = signal.get("rr", "?")

          message = f"""🚨 XAUUSD V8 CAP4 SIGNAL

Direction: {direction}
Entry: {entry}
SL: {sl}
TP: {tp}
R:R: {rr}

M5 confirmation: {latest}
Source: Biquote
Execution: DISABLED (Signal-Only)
"""

          with open("telegram_message.txt", "w", encoding="utf-8") as f:
              f.write(message)
          PY

      - name: Send Telegram signal
        uses: appleboy/telegram-action@v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_file: telegram_message.txt
          disable_web_page_preview: true
      - name: Prepare dashboard site
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp dashboard/index.html _site/index.html
          if [ -f data/xauusd_analysis.json ]; then
            cp data/xauusd_analysis.json _site/data/xauusd_analysis.json
          else
            printf '{"status":"DATA_NOT_AVAILABLE"}' > _site/data/xauusd_analysis.json
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
