name: V8 Cap4 Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V8 experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups

      - name: Run V8 Cap4 live dry-run
        run: |
          set -euo pipefail
          python scripts/fvg_v8_live_dry_run.py

      - name: Prepare dashboard site
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp dashboard/index.html _site/index.html
          if [ -f data/xauusd_analysis.json ]; then
            cp data/xauusd_analysis.json _site/data/xauusd_analysis.json
          else
            printf '{"status":"DATA_NOT_AVAILABLE"}' > _site/data/xauusd_analysis.json
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
