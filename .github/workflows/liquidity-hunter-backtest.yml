name: Liquidity Hunter Data Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run historical data check
        run: python3 scripts/liquidity_hunter_backtest.py
      - name: Commit result
        run: |
          git config user.name "xauusd-data-relay"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/liquidity_hunter_results.json
          git diff --cached --quiet || git commit -m "Add Liquidity Hunter data check result"
          git push
