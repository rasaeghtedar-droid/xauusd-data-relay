name: Backfill XAUUSD History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backfill 35 days of closed candles
        run: python3 scripts/backfill_biquote_history.py
      - name: Commit history
        run: |
          git config user.name "xauusd-data-relay"
          git config user.email "actions@users.noreply.github.com"
          git add history/
          git diff --cached --quiet || git commit -m "Backfill 35 days of XAUUSD history"
          git push
