name: Historical XAUUSD Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run historical comparison
        run: python3 scripts/historical_external_backtest.py
      - name: Upload detailed result
        uses: actions/upload-artifact@v4
        with:
          name: historical-xauusd-backtest-result
          path: |
            backtest/historical_external_comparison.json
            history/external_xauusd_5m.csv
      - name: Commit result
        run: |
          git config user.name "xauusd-data-relay"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/historical_external_comparison.json
          git diff --cached --quiet || git commit -m "Add historical XAUUSD backtest result"
          git pull --rebase origin main
          git push
