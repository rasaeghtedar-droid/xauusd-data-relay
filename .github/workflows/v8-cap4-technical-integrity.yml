name: V8 Cap4 Technical Integrity Test

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send a Telegram notification test"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V8 experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups

      - name: Python syntax check
        run: |
          set -euo pipefail
          python -m py_compile scripts/fvg_v8_live_dry_run.py
          python -m py_compile scripts/fvg_executable_audit_v8.py
          python -m py_compile scripts/fvg_only_gold_hunter_backtest.py
          echo "PY_COMPILE=PASS"

      - name: Import V8 Cap4 engine
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts import fvg_v8_live_dry_run as live
          from scripts.fvg_executable_audit_v8 import target as cap4_target
          from scripts.fvg_only_gold_hunter_backtest import fvg_at, agg, PAD, LOOKBACK

          assert live.FRESHNESS_MINUTES == 30.0
          assert live.M5_LIMIT == 1000
          assert callable(cap4_target)
          assert callable(fvg_at)
          assert callable(agg)
          assert PAD == 0.5
          assert LOOKBACK == 30

          print("ENGINE=FVG_EXECUTABLE_AUDIT_V8_CAP4")
          print("FRESHNESS_RULE=<=30_MINUTES")
          print("M5_LIMIT=1000")
          print("PAD=0.5")
          print("LOOKBACK=30")
          print("IMPORT=PASS")
          PY

      - name: Verify no order execution path
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("scripts/fvg_v8_live_dry_run.py")
          tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))

          forbidden_modules = {"MetaTrader5", "MetaTrader5.exe"}
          forbidden_calls = {"order_send", "send_order"}

          violations = []

          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name in forbidden_modules or alias.name.startswith("MetaTrader5."):
                          violations.append(f"import:{alias.name}:{node.lineno}")
              elif isinstance(node, ast.ImportFrom):
                  if node.module and (
                      node.module in forbidden_modules
                      or node.module.startswith("MetaTrader5.")
                  ):
                      violations.append(f"from_import:{node.module}:{node.lineno}")
              elif isinstance(node, ast.Call):
                  func = node.func
                  if isinstance(func, ast.Name) and func.id in forbidden_calls:
                      violations.append(f"call:{func.id}:{node.lineno}")
                  elif isinstance(func, ast.Attribute) and func.attr in forbidden_calls:
                      violations.append(f"call:{func.attr}:{node.lineno}")

          if violations:
              raise AssertionError(
                  "Unexpected order-execution AST reference(s): " + ", ".join(violations)
              )

          print("ORDER_EXECUTION_PATH=ABSENT")
          print("CHECK_METHOD=AST_EXCLUDING_COMMENTS_AND_DOCSTRINGS")
          PY

      - name: Send Telegram test notification
        if: ${{ inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          message = """🧪 XAUUSD V8 Cap4 — TELEGRAM TEST

این پیام فقط برای تست Notification Bot است.
موتور V8 در این تست اجرا نشده است.
Auto Trade DISABLED"""

          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          body = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
          }).encode()

          req = urllib.request.Request(url, data=body, method="POST")
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)

          if not result.get("ok"):
              raise RuntimeError(result)

          print("TELEGRAM_TEST=PASS")
          PY

      - name: Verify output contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("scripts/fvg_v8_live_dry_run.py").read_text(encoding="utf-8")

          required = [
              'DATA_NOT_AVAILABLE',
              'DATA_STALE',
              'NO TRADE',
              'SIGNAL',
              'FVG_EXECUTABLE_AUDIT_V8_CAP4',
              'latest_closed_m5',
              'freshness_minutes',
              'signal_key',
              'entry',
              'sl',
              'tp',
              'rr',
          ]

          missing = [x for x in required if x not in source]
          if missing:
              raise AssertionError(f"Missing output contract fields: {missing}")

          print("OUTPUT_CONTRACT=PASS")
          print(json.dumps({"required_tokens": len(required)}, indent=2))
          PY
