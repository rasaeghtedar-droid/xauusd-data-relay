name: FVG 90 Percent Depth Comparison
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - period: first-half
            start_utc: "2026-08-01T00:00:00+00:00"
            end_utc: "2026-08-20T23:59:59+00:00"
          - period: second-half
            start_utc: "2026-08-21T00:00:00+00:00"
            end_utc: "2026-09-09T23:59:59+00:00"
          - period: unseen-oos
            start_utc: "2026-09-10T00:00:00+00:00"
            end_utc: "2026-10-16T23:59:59+00:00"
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run midpoint versus 70, 80 and 90 percent depth comparison
        env:
          FVG_ONLY_START_UTC: ${{ matrix.start_utc }}
          FVG_ONLY_END_UTC: ${{ matrix.end_utc }}
          COMBINED_SOURCE_URL: "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv"
          PYTHONPATH: .
        run: |
          set -o pipefail
          python scripts/fvg_90_depth_comparison.py | tee /tmp/fvg_90_depth_comparison_output.txt
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: fvg-depth-comparison-${{ matrix.period }}
          path: |
            backtest/fvg_90_depth_comparison.json
            backtest/fvg_raw_price_audit.json
          if-no-files-found: error
