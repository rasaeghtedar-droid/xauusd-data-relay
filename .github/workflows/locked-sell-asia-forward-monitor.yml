name: XAUUSD Locked SELL Asia Forward Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * 1-5"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh market data
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = "https://biquote.io/api/XAUUSD/ohlc"
          limits = {"5m": 60, "15m": 40, "1h": 40}

          def fetch(interval, limit):
              url = f"{BASE}?interval={interval}&limit={limit}"
              req = urllib.request.Request(url, headers={"User-Agent":"XAUUSD-Forward-Monitor/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  payload = json.load(r)
              bars = [b for b in payload.get("bars", []) if b.get("isOpen") is False]
              bars.sort(key=lambda b:b.get("openTime",""))
              if not bars:
                  raise RuntimeError(f"No closed bars for {interval}")
              return bars[-limit:]

          fetched = datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
          out = {"symbol":"XAUUSD","source":"Biquote","fetchedAt":fetched,"intervals":{}}
          for interval, limit in limits.items():
              bars = fetch(interval, limit)
              out["intervals"][interval] = {"latestClosed":bars[-1],"bars":bars}
          Path("data/xauusd_analysis.json").write_text(json.dumps(out,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          print("Forward data refreshed:", fetched)
          PY

      - name: Run locked forward monitor
        run: python3 scripts/locked_sell_asia_forward.py

      - name: Publish new signal
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The refreshed market-data file is intentionally not published by this workflow.
          git restore -- data/xauusd_analysis.json
          git add data/locked_sell_asia_forward_state.json
          if [ -f data/locked_sell_asia_forward_signal.json ]; then
            git add data/locked_sell_asia_forward_signal.json
          fi
          if git diff --cached --quiet; then
            echo "No new signal or state changes."
            exit 0
          fi
          git commit -m "Record locked SELL Asia forward state"
          git pull --rebase origin main
          git push

      - name: Send Telegram alert
        if: success() && hashFiles('data/locked_sell_asia_forward_signal.json') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = "data/locked_sell_asia_forward_signal.json"
          payload = json.load(open(path, encoding="utf-8"))
          s = payload["signal"]

          candle_time = datetime.fromisoformat(s["candle_time"].replace("Z","+00:00"))
          iran_time = candle_time.astimezone(ZoneInfo("Asia/Tehran")).strftime("%Y-%m-%d %H:%M")

          text = (
              "🥇 XAUUSD — SELL SIGNAL\n\n"
              f"📍 Entry: {s['entry']}\n"
              f"🛑 SL: {s['sl']}\n"
              f"🎯 TP: {s['tp']}\n"
              f"📊 R:R: {s['rr']}\n"
              f"⏰ زمان سیگنال: {iran_time} به وقت ایران 🇮🇷\n\n"
              f"🔑 دلیل: {s.get('reason','Liquidity sweep + M5 confirmation')}\n"
              "⚠️ Signal only — بررسی دستی قبل از معامله"
          )

          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          body = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": text
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST")
          with urllib.request.urlopen(req, timeout=30) as r:
              response = json.load(r)
          if not response.get("ok"):
              raise RuntimeError(response)
          print("Telegram alert sent.")
          PY
