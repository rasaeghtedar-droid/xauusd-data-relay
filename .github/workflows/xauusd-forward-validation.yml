name: XAUUSD Forward Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run forward validation
        run: python3 scripts/forward_validation.py
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-forward-validation
          path: backtest/forward_validation.json
      - name: Commit validation report
        run: |
          git config user.name "xauusd-data-relay"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/forward_validation.json
          git diff --cached --quiet || git commit -m "Add XAUUSD forward validation report"
          git pull --rebase origin main
          git push
