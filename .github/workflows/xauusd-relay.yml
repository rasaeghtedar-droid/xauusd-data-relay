name: XAUUSD Data Relay

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose Biquote XAUUSD OHLC
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import urllib.request

          url = "https://biquote.io/api/XAUUSD/ohlc?interval=5m&limit=10"

          print("========================================")
          print("BIQUOTE XAUUSD DIAGNOSTIC")
          print("========================================")
          print()
          print("REQUEST URL:")
          print(url)
          print()

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print("HTTP STATUS:")
                  print(response.status)
                  print()

                  raw = response.read().decode("utf-8")

          except Exception as e:
              print("REQUEST ERROR:")
              print(repr(e))
              raise

          print("RAW RESPONSE:")
          print("----------------------------------------")
          print(raw[:10000])
          print("----------------------------------------")
          print()

          try:
              payload = json.loads(raw)
          except Exception as e:
              print("JSON PARSE ERROR:")
              print(repr(e))
              raise

          print("TOP LEVEL TYPE:")
          print(type(payload).__name__)
          print()

          if isinstance(payload, dict):
              print("TOP LEVEL KEYS:")
              print(list(payload.keys()))
              print()

          if isinstance(payload, dict):
              print("BARS AT ROOT:")
              print(type(payload.get("bars")).__name__)
              print()

              print("BARS COUNT:")
              print(len(payload.get("bars", [])))
              print()

          print("========================================")
          print("DIAGNOSTIC FINISHED")
          print("========================================")
          PY
