name: XAUUSD Data Relay

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch XAUUSD OHLC
        run: |
          set -euo pipefail

          mkdir -p data

          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          BASE_URL = "https://biquote.io/api/XAUUSD/ohlc"

          INTERVALS = {
              "5m": 200,
              "15m": 200,
              "1h": 200,
          }

          def fetch(interval, limit):
              url = f"{BASE_URL}?interval={interval}&limit={limit}"

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "XAUUSD-Data-Relay/1.0",
                      "Accept": "application/json",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  if response.status != 200:
                      raise RuntimeError(
                          f"HTTP {response.status} for {interval}"
                      )

                  payload = json.load(response)

              bars = payload.get("bars", [])

              if not bars:
                  raise RuntimeError(
                      f"No bars returned for {interval}"
                  )

              closed = [
                  bar
                  for bar in bars
                  if bar.get("isOpen") is False
              ]

              if not closed:
                  raise RuntimeError(
                      f"No closed bars returned for {interval}"
                  )

              closed.sort(
                  key=lambda bar: bar.get(
                      "openTime",
                      ""
                  )
              )

              return {
                  "latestClosed": closed[-1],
                  "bars": closed[-200:],
              }

          fetched_at = datetime.now(
              timezone.utc
          ).isoformat().replace("+00:00", "Z")

          output = {
              "symbol": "XAUUSD",
              "source": "Biquote",
              "fetchedAt": fetched_at,
              "intervals": {}
          }

          for interval, limit in INTERVALS.items():
              print(f"Fetching {interval}...")
              result = fetch(interval, limit)

              output["intervals"][interval] = result

              print(
                  f"{interval} latest closed:",
                  result["latestClosed"]
              )

          Path("data/xauusd.json").write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print()
          print("========================================")
          print("RELAY UPDATE COMPLETED")
          print("========================================")
          print("Fetched at:", fetched_at)
          print("Intervals:", list(output["intervals"].keys()))
          print("Output: data/xauusd.json")
          PY

      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/xauusd.json

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update XAUUSD market data"
          git push
