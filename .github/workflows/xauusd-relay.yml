name: XAUUSD Data Relay

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch compact XAUUSD analysis data
        run: |
          set -euo pipefail
          mkdir -p data

          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          BASE_URL = "https://biquote.io/api/XAUUSD/ohlc"
          LIMITS = {"5m": 1000, "15m": 40, "1h": 40}

          def fetch_batch(interval, limit, to_time=None):
              params = {"interval": interval, "limit": min(limit, 60)}
              if to_time:
                  params["to"] = to_time
              url = f"{BASE_URL}?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "XAUUSD-Data-Relay/3.1", "Accept": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status} for {interval}")
                  payload = json.load(response)

              bars = [b for b in payload.get("bars", []) if b.get("isOpen") is False]
              bars.sort(key=lambda b: b.get("openTime", ""))
              return bars

          def fetch_closed(interval, limit):
              collected = {}
              cursor = None

              for _ in range(20):
                  batch = fetch_batch(interval, limit, cursor)
                  if not batch:
                      break

                  for bar in batch:
                      if bar.get("openTime") and bar.get("isOpen") is False:
                          collected[bar["openTime"]] = bar

                  if len(collected) >= limit:
                      break

                  oldest = min(collected)
                  oldest_dt = datetime.fromisoformat(oldest.replace("Z", "+00:00"))
                  cursor = (oldest_dt - timedelta(milliseconds=1)).isoformat().replace("+00:00", "Z")

                  if len(batch) < min(limit, 60):
                      break

              bars = sorted(collected.values(), key=lambda b: b.get("openTime", ""))
              if not bars:
                  raise RuntimeError(f"No closed bars returned for {interval}")
              return bars[-limit:]

          fetched_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          output = {
              "symbol": "XAUUSD",
              "source": "Biquote",
              "fetchedAt": fetched_at,
              "intervals": {}
          }

          for interval, limit in LIMITS.items():
              bars = fetch_closed(interval, limit)
              output["intervals"][interval] = {
                  "latestClosed": bars[-1],
                  "bars": bars
              }
              print(f"{interval}: {len(bars)} closed bars")

          Path("data/xauusd_analysis.json").write_text(
              json.dumps(output, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )
          print("Wrote data/xauusd_analysis.json")
          print("Fetched at:", fetched_at)
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/xauusd_analysis.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Extend XAUUSD relay with paginated closed M5 history"
          git push
