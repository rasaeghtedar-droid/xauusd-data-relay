name: XAUUSD Data Relay

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch XAUUSD OHLC
        run: |
          set -euo pipefail

          mkdir -p data

          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          BASE_URL = "https://biquote.io/api/XAUUSD/ohlc"
          INTERVALS = {
              "5m": 200,
              "15m": 200,
              "1h": 200,
          }

          def fetch(interval, limit):
              url = f"{BASE_URL}?interval={interval}&limit={limit}"

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "XAUUSD-Data-Relay/1.0"}
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)

              bars = payload.get("data", {}).get("bars", [])

              if not bars:
                  raise RuntimeError(
                      f"No bars returned for interval {interval}"
                  )

              closed = [
                  bar for bar in bars
                  if bar.get("isOpen") is False
              ]

              if not closed:
                  raise RuntimeError(
                      f"No closed bars returned for interval {interval}"
                  )

              closed.sort(
                  key=lambda x: x.get("openTime", "")
              )

              return {
                  "latestClosed": closed[-1],
                  "bars": closed[-200:]
              }

          output = {
              "symbol": "XAUUSD",
              "source": "Biquote",
              "fetchedAt": datetime.now(
                  timezone.utc
              ).isoformat().replace("+00:00", "Z"),
              "intervals": {}
          }

          for interval, limit in INTERVALS.items():
              output["intervals"][interval] = fetch(
                  interval,
                  limit
              )

          Path("data/xauusd.json").write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print(
              "Relay update completed:",
              output["fetchedAt"]
          )
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/xauusd.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update XAUUSD market data"
          git push
