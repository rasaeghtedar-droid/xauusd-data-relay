name: XAUUSD Data Relay

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch XAUUSD OHLC
        run: |
          set -euo pipefail
          mkdir -p data

          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          BASE_URL = "https://biquote.io/api/XAUUSD/ohlc"
          INTERVALS = {"5m": 200, "15m": 200, "1h": 200}

          def fetch(interval, limit):
              url = f"{BASE_URL}?interval={interval}&limit={limit}"
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "XAUUSD-Data-Relay/2.0", "Accept": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status} for {interval}")
                  payload = json.load(response)

              bars = payload.get("bars", [])
              closed = [bar for bar in bars if bar.get("isOpen") is False]
              if not closed:
                  raise RuntimeError(f"No closed bars returned for {interval}")
              closed.sort(key=lambda bar: bar.get("openTime", ""))
              return closed[-200:]

          fetched_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          for interval, limit in INTERVALS.items():
              bars = fetch(interval, limit)
              output = {
                  "symbol": "XAUUSD",
                  "source": "Biquote",
                  "interval": interval,
                  "fetchedAt": fetched_at,
                  "latestClosed": bars[-1],
                  "bars": bars,
              }
              Path(f"data/xauusd_{interval}.json").write_text(
                  json.dumps(output, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )
              print(f"{interval}: {len(bars)} closed bars")

          print("RELAY UPDATE COMPLETED")
          print("Fetched at:", fetched_at)
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/xauusd_5m.json data/xauusd_15m.json data/xauusd_1h.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Split XAUUSD relay data by timeframe"
          git push
