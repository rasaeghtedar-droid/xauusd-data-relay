name: XAUUSD Locked SELL Asia August-September External

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run independent validation
        run: python3 scripts/locked_sell_asia_august_september_external.py
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd-locked-sell-asia-august-september-external
          path: backtest/locked_sell_asia_august_september_external.json
      - name: Commit result
        run: |
          git config user.name "xauusd-data-relay"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/locked_sell_asia_august_september_external.json
          git diff --cached --quiet || git commit -m "Add August-September SELL Asia validation"
          git pull --rebase origin main
          git push
