name: V8 Entry Sensitivity Research
on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: "Historical 30-day sample start UTC"
        required: true
        default: "2026-08-26T00:00:00+00:00"
        type: string
      end_utc:
        description: "Historical 30-day sample end UTC"
        required: true
        default: "2026-09-25T23:59:59+00:00"
        type: string

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated V8 research branch
        uses: actions/checkout@v4
        with:
          ref: experiment-fvg-setups

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate historical 5-minute dataset coverage
        env:
          COMBINED_SOURCE_URL: https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, os, urllib.request
          url = os.environ["COMBINED_SOURCE_URL"]
          raw = urllib.request.urlopen(url, timeout=60).read().decode("utf-8")
          rows = list(csv.DictReader(io.StringIO(raw)))
          if len(rows) < 5000:
              raise RuntimeError(f"Historical dataset unexpectedly small: {len(rows)} rows")
          print("HISTORICAL_M5_COUNT=", len(rows))
          print("FIRST_M5=", rows[0]["datetime"])
          print("LAST_M5=", rows[-1]["datetime"])
          PY
      - name: Compile research script and engine imports
        run: |
          set -euo pipefail
          python -m py_compile scripts/v8_entry_sensitivity_test.py scripts/fvg_v8_live_dry_run.py
          python - <<'PY'
          from scripts import fvg_v8_live_dry_run as live
          assert callable(live.run_v8)
          print("LOCKED_V8_IMPORT=PASS")
          PY

      - name: Run isolated sensitivity comparison
        env:
          FVG_ONLY_START_UTC: ${{ inputs.start_utc }}
          FVG_ONLY_END_UTC: ${{ inputs.end_utc }}
          V8_SENSITIVITY_DATA_JSON: /tmp/no-local-relay-json.json
          COMBINED_SOURCE_URL: https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv
        run: |
          set -euo pipefail
          python scripts/v8_entry_sensitivity_test.py | tee /tmp/v8_entry_sensitivity.log

      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: v8-entry-sensitivity-results
          path: |
            backtest/v8_entry_sensitivity_results.json
            /tmp/v8_entry_sensitivity.log
          if-no-files-found: error
          retention-days: 14
