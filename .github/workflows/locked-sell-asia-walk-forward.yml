name: XAUUSD Locked SELL Asia Walk Forward

on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/locked_sell_asia_walk_forward.py
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd-locked-sell-asia-walk-forward
          path: backtest/locked_sell_asia_walk_forward.json
      - run: |
          git config user.name "xauusd-data-relay"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/locked_sell_asia_walk_forward.json
          git diff --cached --quiet || git commit -m "Add locked SELL Asia walk-forward validation"
          git pull --rebase origin main
          git push
