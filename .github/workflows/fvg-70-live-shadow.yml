name: FVG 70 Live Shadow Test

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      confirm_shadow_only:
        description: 'Confirm this is an isolated shadow test (no real orders)'
        required: true
        type: choice
        options:
          - 'YES - SHADOW ONLY'
        default: 'YES - SHADOW ONLY'

permissions:
  contents: write

concurrency:
  group: fvg-70-live-shadow
  cancel-in-progress: false

jobs:
  shadow-test:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.confirm_shadow_only == 'YES - SHADOW ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
        with:
          ref: fvg-70-live-shadow
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas requests PyYAML
      - name: Fetch accumulated relay candle history (read-only)
        run: |
          mkdir -p data
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rasaeghtedar-droid/xauusd-data-relay/main/data/xauusd_analysis.json \
            -o data/_relay_xauusd_analysis.json
      - name: Run same-candle 50% vs 70% comparison
        id: compare
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/fvg_depth_shadow_comparison.py
      - name: Persist isolated shadow candle history
        if: steps.compare.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fvg_depth_shadow_candles.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update isolated FVG depth shadow candle history'
            git push origin HEAD:fvg-70-live-shadow
          else
            echo 'No shadow candle history changes to persist.'
          fi
      - name: Run isolated 70% live shadow payload
        if: always()
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/fvg_70_live_shadow.py
      - name: Upload shadow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fvg-depth-shadow-comparison
          path: |
            data/fvg_depth_shadow_comparison.json
            data/fvg_depth_shadow_comparison.csv
            data/fvg_depth_shadow_candles.json
            data/fvg_70_live_shadow.json
            data/fvg_70_live_shadow_history.json
          if-no-files-found: warn
          retention-days: 14
