name: Archive XAUUSD History

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive closed candles
        run: python3 scripts/archive_biquote.py

      - name: Commit history
        run: |
          git config user.name "xauusd-data-relay"
          git config user.email "actions@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "No new closed candles."
            exit 0
          fi
          git commit -m "Archive XAUUSD closed candles"
          git push
