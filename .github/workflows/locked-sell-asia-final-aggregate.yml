name: XAUUSD Locked SELL Asia FINAL Aggregate Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run FINAL aggregate validation
        run: python3 scripts/locked_sell_asia_final_aggregate.py
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd-locked-sell-asia-final-aggregate
          path: backtest/locked_sell_asia_final_aggregate.json
      - name: Commit result
        run: |
          git config user.name "xauusd-data-relay"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/locked_sell_asia_final_aggregate.json
          git diff --cached --quiet || git commit -m "Add final aggregate SELL Asia validation"
          git pull --rebase origin main
          git push
