name: One-time V8 trigger cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove temporary V8 trigger cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove native V8 schedule and this helper
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/v8-cap4-dashboard.yml")
          text = p.read_text()
          old = 'on:\n  workflow_dispatch:\n  schedule:\n    - cron: "2-59/5 * * * *"\n'
          new = 'on:\n  workflow_dispatch:\n'
          if old not in text:
              raise SystemExit("Expected V8 schedule block not found")
          p.write_text(text.replace(old, new, 1))
          Path(".github/workflows/remove-v8-schedule.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/v8-cap4-dashboard.yml .github/workflows/remove-v8-schedule.yml
          git commit -m "Remove native V8 schedule"
          git push origin HEAD:main
