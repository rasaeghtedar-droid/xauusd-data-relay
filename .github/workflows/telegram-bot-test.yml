name: Telegram Bot Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json

          message = """🧪 XAUUSD V8 Telegram TEST

این پیام فقط برای تست Notification Bot است.
V8 Engine اجرا نشده و هیچ سیگنال معاملاتی تولید نشده است.

Signal-Only — Auto Trade DISABLED"""

          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          body = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
          }).encode()

          req = urllib.request.Request(url, data=body, method="POST")
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)

          if not result.get("ok"):
              raise RuntimeError(result)

          print("Telegram test message sent successfully.")
          PY
