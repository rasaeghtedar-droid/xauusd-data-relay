name: Historical XAUUSD Out-of-Sample

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate locked holdout
        run: python3 scripts/historical_xauusd_oos.py
      - name: Upload OOS report
        uses: actions/upload-artifact@v4
        with:
          name: historical-xauusd-oos-report
          path: backtest/historical_xauusd_oos.json
      - name: Commit OOS report
        run: |
          git config user.name "xauusd-data-relay"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/historical_xauusd_oos.json
          git diff --cached --quiet || git commit -m "Add locked XAUUSD out-of-sample report"
          git pull --rebase origin main
          git push
